<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1C2C58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="朝刊">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>朝刊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* レイアウト：ニュースアプリ型。固定の題字とジャンルタブ → 大見出し（画像）→ 見出しの右に画像が並ぶ一覧。記事は全画面の記事画面で開く。幅は最大680px */
:root{
  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --sunk:#E4E9F1;
  --ink:#111A2E;
  --ink-2:#414C64;
  --ink-3:#6E7990;
  --line:#E1E5EE;
  --navy:#1C2C58;
  --navy-ink:#FFFFFF;
  --urgent:#D0342C; --urgent-bg:#FCE8E6;
  --ig:#B8235A; --ig-bg:#FBE8EF;
  --card:#8A5900; --card-bg:#FAF0D9;
  --re:#20704A; --re-bg:#E1F2E8;
  --ai:#1F4FB5; --ai-bg:#E5ECFA;
  --otoku:#BC3D0A; --otoku-bg:#FCEADD;
  --up:#C42B2B; --down:#1D5FC0;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#141B2D; --sunk:#1B2338;
    --ink:#E9EDF5; --ink-2:#B3BCCD; --ink-3:#8590A6; --line:#263049;
    --navy:#AFC1F4; --navy-ink:#0B1020;
    --urgent:#FF7B72; --urgent-bg:#3A1716;
    --ig:#F27AA6; --ig-bg:#3A1828; --card:#E8B456; --card-bg:#33270F;
    --re:#6BCB97; --re-bg:#12301F; --ai:#8AACF6; --ai-bg:#16244A;
    --otoku:#F59562; --otoku-bg:#3A1F12;
    --up:#F27B7B; --down:#7FB0F5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#141B2D; --sunk:#1B2338;
  --ink:#E9EDF5; --ink-2:#B3BCCD; --ink-3:#8590A6; --line:#263049;
  --navy:#AFC1F4; --navy-ink:#0B1020;
  --urgent:#FF7B72; --urgent-bg:#3A1716;
  --ig:#F27AA6; --ig-bg:#3A1828; --card:#E8B456; --card-bg:#33270F;
  --re:#6BCB97; --re-bg:#12301F; --ai:#8AACF6; --ai-bg:#16244A;
  --otoku:#F59562; --otoku-bg:#3A1F12;
  --up:#F27B7B; --down:#7FB0F5;
  color-scheme:dark;
}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.c-instagram{--c:var(--ig);--cb:var(--ig-bg)}
.c-card{--c:var(--card);--cb:var(--card-bg)}
.c-realestate{--c:var(--re);--cb:var(--re-bg)}
.c-ai{--c:var(--ai);--cb:var(--ai-bg)}
.c-otoku{--c:var(--otoku);--cb:var(--otoku-bg)}
.c-top,.c-saved{--c:var(--navy);--cb:var(--sunk)}

.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 題字とタブ */
.masthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.mast-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{display:grid;grid-template-columns:repeat(5,4px);gap:2px;height:22px;flex:none}
.brand-mark i{display:block;border-radius:2px}
.brand-mark i:nth-child(1){background:var(--ig)}
.brand-mark i:nth-child(2){background:var(--card)}
.brand-mark i:nth-child(3){background:var(--re)}
.brand-mark i:nth-child(4){background:var(--ai)}
.brand-mark i:nth-child(5){background:var(--otoku)}
.brand-name{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.02em;color:var(--navy);line-height:1;white-space:nowrap}
.edition{position:relative;flex:none}
.edition select{appearance:none;-webkit-appearance:none;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:6px 30px 6px 12px;cursor:pointer;max-width:46vw}
.edition::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:-6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:5px;padding:9px 10px 8px;font-size:15px;font-weight:700;color:var(--ink-3);border-bottom:3px solid transparent;white-space:nowrap}
.tab .n{font-size:11px;font-weight:700;min-width:17px;height:17px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;background:var(--sunk);color:var(--ink-2);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--c);border-bottom-color:var(--c)}
.tab[aria-selected="true"] .n{background:var(--c);color:var(--surface)}

/* 本文 */
.main{padding-block:14px 28px;display:flex;flex-direction:column;gap:16px}
.dateline{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dateline h1{font-family:var(--display);font-weight:900;font-size:21px;line-height:1.3;margin:0;color:var(--c,var(--ink))}
.dateline .meta{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.notice{font-size:13.5px;color:var(--ink-2);background:var(--sunk);border-radius:10px;padding:9px 12px;margin:0;line-height:1.6}
.notice.warn{background:var(--otoku-bg);color:var(--ink)}

/* まとまり（白い面） */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 8px}
.panel-head h2{margin:0;font-family:var(--display);font-weight:900;font-size:17px;line-height:1.3;display:flex;align-items:center;gap:8px}
.panel-head h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.panel-head .count{font-family:var(--body);font-weight:700;font-size:12px;color:var(--ink-3)}
.more-link{font-size:13px;font-weight:700;color:var(--c);white-space:nowrap;padding:4px 2px}
.panel-lead{margin:0;padding:0 14px 10px;font-size:13.5px;color:var(--ink-2);line-height:1.6}

/* 大見出し */
.hero{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel .hero{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.hero-img{position:relative;display:block;aspect-ratio:16/9;max-width:100%;background:var(--cb)}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero-body{display:flex;flex-direction:column;gap:6px;padding:12px 14px 13px}
.hero-title{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.45;margin:0;text-wrap:pretty}
.hero-sum{margin:0;font-size:14px;color:var(--ink-2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 一覧の行（見出しの右に画像） */
.rows{list-style:none;margin:0;padding:0}
.rows li+li .row{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;align-items:start;width:100%;padding:12px 14px;background:var(--surface)}
.row:hover{background:var(--sunk)}
.row-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.row-title{font-weight:700;font-size:15.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.is-read .row-title,.is-read .hero-title{color:var(--ink-3)}
.meta-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--ink-3);line-height:1.4}
.meta-line .src{max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 画像の札（画像がないときはジャンルの色） */
.thumb{position:relative;display:block;width:96px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--cb);flex:none}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;color:var(--c);font-size:13px;letter-spacing:.04em;padding:6px;text-align:center;line-height:1.3}
.hero-img .ph{font-size:22px}

/* 小さな札 */
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;line-height:1;padding:4px 6px;border-radius:5px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.badge.cat{color:var(--c);background:var(--cb)}
.badge.urgent{background:var(--urgent);color:#fff}
.badge.soon{background:var(--urgent-bg);color:var(--urgent)}
.badge.start{background:var(--ai-bg);color:var(--ai)}
.badge.paid{background:var(--navy);color:var(--navy-ink)}
.badge.new{background:transparent;color:var(--urgent);padding-inline:0}

/* ジャンルの頭 */
.brief{background:var(--cb);border-radius:12px;padding:12px 14px}
.brief b{display:block;font-size:12px;color:var(--c);letter-spacing:.06em;margin-bottom:2px}
.brief p{margin:0;font-size:14.5px;line-height:1.7;color:var(--ink)}
.indicators{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ind{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ind-label{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.45}
.ind-value{font-family:var(--display);font-weight:900;font-size:21px;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ind-change{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.ind-change.up{color:var(--up)} .ind-change.down{color:var(--down)} .ind-change.flat{color:var(--ink-3)}
.ind-change small{font-weight:400;color:var(--ink-3);font-size:12px}
.ind-src{font-size:11.5px;color:var(--ink-3);line-height:1.45;overflow-wrap:anywhere}
.ind-src a{color:var(--ink-3)}
.hot{display:flex;flex-wrap:wrap;gap:6px}
.hot span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--c);color:var(--c);background:var(--surface)}
.subhead{margin:4px 2px -6px;font-family:var(--display);font-weight:900;font-size:16px;display:flex;align-items:baseline;gap:8px}
.subhead small{font-family:var(--body);font-weight:700;font-size:12px;color:var(--ink-3)}

/* 記事画面 */
.detail{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-bar{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.d-bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px}
.d-back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;color:var(--ink);padding:6px 8px 6px 0}
.d-back svg{width:20px;height:20px}
.d-cat{font-size:13px;font-weight:700;color:var(--c)}
.d-body{display:flex;flex-direction:column;gap:14px;padding-block:14px 32px}
.d-img{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:var(--cb)}
.d-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.d-title{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.45;margin:0;text-wrap:pretty}
.d-when{display:flex;flex-wrap:wrap;gap:8px}
.d-when span{font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px}
.d-when .dl{background:var(--urgent-bg);color:var(--urgent)}
.d-when .st{background:var(--ai-bg);color:var(--ai)}
.d-sum{margin:0;font-size:16px;line-height:1.85}
.points{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.75}
.points li::marker{color:var(--c)}
.why{background:var(--cb);border-radius:12px;padding:12px 14px}
.why b{display:block;font-size:12px;color:var(--c);letter-spacing:.06em;margin-bottom:2px}
.why p{margin:0;font-size:15px;line-height:1.75}
.d-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;text-decoration:none;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--c);border-color:var(--c);color:var(--surface)}
.btn svg{width:18px;height:18px}
.btn[aria-pressed="true"]{color:var(--card);border-color:var(--card)}
.d-src{font-size:13px;color:var(--ink-3);line-height:1.6;overflow-wrap:anywhere}

/* 毎朝の通知 */
.push-cta{display:flex;align-items:center;gap:12px;width:100%;background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:13px 16px}
.push-cta svg{width:24px;height:24px;flex:none}
.push-cta b{display:block;font-size:15.5px;line-height:1.4}
.push-cta small{display:block;font-size:12.5px;opacity:.85;line-height:1.5}
.push-cta[disabled]{opacity:.7}

/* 空・読み込み */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 18px;text-align:center;color:var(--ink-2)}
.empty h2{font-family:var(--display);font-size:18px;margin:0 0 6px;color:var(--ink)}
.empty p{margin:0;font-size:14px}
.skel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 96px;gap:12px}
.skel i{display:block;height:12px;border-radius:6px;background:var(--sunk)}
.skel .t{display:flex;flex-direction:column;gap:9px}
.skel .t i:nth-child(1){width:92%;height:15px} .skel .t i:nth-child(2){width:70%;height:15px} .skel .t i:nth-child(3){width:40%}
.skel .p{aspect-ratio:4/3;height:auto;border-radius:8px}
@media (prefers-reduced-motion:no-preference){.skel i{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.5}}

.foot{color:var(--ink-3);font-size:12px;line-height:1.7;padding-block:0 28px}
.foot p{margin:0}
@media (min-width:560px){
  .indicators{grid-template-columns:repeat(3,minmax(0,1fr))}
  .row{grid-template-columns:minmax(0,1fr) 120px}
  .thumb{width:120px}
}
</style>

<header class="masthead">
  <div class="wrap">
    <div class="mast-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">朝刊</span>
      </div>
      <label class="edition">
        <span class="sr">読む日を選ぶ</span>
        <select id="edition"><option>読み込み中</option></select>
      </label>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="ジャンル"></nav>
  </div>
</header>

<main class="wrap main" id="main">
  <div class="skel" aria-hidden="true"><span class="t"><i></i><i></i><i></i></span><i class="p"></i></div>
  <div class="skel" aria-hidden="true"><span class="t"><i></i><i></i><i></i></span><i class="p"></i></div>
  <div class="skel" aria-hidden="true"><span class="t"><i></i><i></i><i></i></span><i class="p"></i></div>
</main>

<div class="detail" id="detail" hidden></div>

<footer class="wrap foot">
  <p>毎朝6時ごろ、Mac Studio が5つのジャンルのニュースを集め、日本語でまとめています。どの記事にも出典を付けています。有料の記事は日経と NewsPicks だけを使っています。画像は各記事の元のサイトのものです。キャンペーンの条件や数字は、申し込む前に元記事で確かめてください。</p>
</footer>

<script>

    {key:"instagram", tab:"インスタ", title:"Instagram運用", ph:"Instagram"},

    {key:"realestate", tab:"不動産", title:"不動産の市況", ph:"不動産"},
    {key:"ai", tab:"AI", title:"AIの動き", ph:"AI"},
    {key:"otoku", tab:"お得", title:"お得・キャンペーン", ph:"お得"}
  ];
  var CAT_BY = {}; CATS.forEach(function(c){ CAT_BY[c.key] = c; });
  var VIEWS = ["top"].concat(CATS.map(function(c){ return c.key; }), ["saved"]);

  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17.03 6.62 19.85l1.03-6L3.3 9.6l6-.9z"/></svg>';
  var STAR_O = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17.03 6.62 19.85l1.03-6L3.3 9.6l6-.9z"/></svg>';
  var BACK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>';

  var S = {
    mode:"db", db:null, uid:null, status:"loading", slow:false, err:null,
    index:null, date:null, followLatest:true, sections:{}, pool:[], active:null, sectionsReady:false, unsubSections:null,
    saved:{}, saving:{}, view:"top", read:loadRead(), reg:{}, detail:null, pushed:false, badImg:{},
    push:null, pushCfg:null, swReg:null, pushMsg:""
  };
  var BELL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16zM10 20.5a2.2 2.2 0 0 0 4 0"/></svg>';

  var h0 = (location.hash || "").replace("#","");
  if (VIEWS.indexOf(h0) >= 0) S.view = h0;

  // ---------- 小道具 ----------
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(ch){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
    });
  }
  function safeUrl(u){ return (typeof u === "string" && /^https?:\/\//i.test(u)) ? u : null; }
  function safeImg(u){ return (typeof u === "string" && /^https:\/\//i.test(u) && !S.badImg[u]) ? u : null; }
  function arr(v){ return Array.isArray(v) ? v : []; }
  function parseYMD(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
    return m ? {y:+m[1], m:+m[2], d:+m[3]} : null;
  }
  function fmtDay(s, withWeek){
    var p = parseYMD(s); if (!p) return "";
    var w = new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay();
    return p.m + "月" + p.d + "日" + (withWeek ? "（" + WEEK[w] + "）" : "");
  }
  function fmtShort(s){
    var p = parseYMD(s); if (!p) return "";
    var w = new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay();
    return p.m + "/" + p.d + "（" + WEEK[w] + "）";
  }
  function fmtMD(s){ var p = parseYMD(s); return p ? p.m + "/" + p.d : ""; }
  function fmtTime(iso){
    var t = new Date(iso); if (isNaN(t)) return "";
    return t.getHours() + ":" + String(t.getMinutes()).padStart(2, "0");
  }
  function daysLeft(s){
    var p = parseYMD(s); if (!p) return null;
    var n = new Date();
    var today = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.round((Date.UTC(p.y, p.m - 1, p.d) - today) / 86400000);
  }
  function seg(s){ return String(s || "").replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 150) || "x"; }
  function itemKey(item, cat, date){ return seg(item.id || (date + "-" + cat + "-" + (item.url || item.title))); }
  function isExpired(it){ var n = it.deadline ? daysLeft(it.deadline) : null; return n != null && n < 0; }
  function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, ""); } catch(e){ return ""; } }

  function loadRead(){
    try { var a = JSON.parse(localStorage.getItem("nken-chokan-read") || "[]"); var o = {}; a.forEach(function(k){ o[k] = 1; }); return o; }
    catch(e){ return {}; }
  }
  function markRead(k){
    if (S.read[k]) return;
    S.read[k] = 1;
    try { var keys = Object.keys(S.read); localStorage.setItem("nken-chokan-read", JSON.stringify(keys.slice(-4000))); } catch(e){}
  }

  function sectionItems(cat){
    var sec = S.sections[cat];
    return sec ? arr(sec.items).filter(function(it){ return it && it.title && !isExpired(it); }) : [];
  }
  function secDate(cat){ var sec = S.sections[cat]; return (sec && sec.date) || S.date; }
  function unreadCount(cat){
    return sectionItems(cat).filter(function(it){ return !S.read[itemKey(it, cat, secDate(cat))]; }).length;
  }
  function latestUpdate(){
    var best = "";
    CATS.forEach(function(c){ var s = S.sections[c.key]; if (s && s.updated_at && s.updated_at > best) best = s.updated_at; });
    return best;
  }
  function statusFor(cat){
    var st = S.index && S.index.status;
    if (!st || st.date !== S.date || !st.cats) return null;
    return st.cats[cat] || null;
  }
  function isLatest(){ return !!(S.index && S.index.latest === S.date); }
  function catProblem(cat){
    var sec = S.sections[cat], st = statusFor(cat);
    var stale = !sec || sec.date !== S.date;
    var bad = st && st.state && st.state !== "ok";
    if (!stale && !bad) return null;
    var msg;
    if (st && st.state === "running") msg = "いま集めています";
    else if (st && st.state === "failed") msg = "取得に失敗しました" + (st.next ? "。" + st.next + "に自動で取り直します" : "");
    else msg = "まだ届いていません。7時・9時・12時に自動で取り直します";
    return {stale: stale, msg: msg};
  }

  // 締切・開始日のある記事を集める（公開サイトは過去30日分の active.json、claude.ai は読み込んだ数日分）
  function campaignPool(){
    var seen = {}, out = [];
    function add(item, cat, date){
      if (!item || !item.title || !CAT_BY[cat]) return;
      var key = item.url || item.id;
      if (seen[key]) return;
      seen[key] = 1; out.push({item:item, cat:cat, date:date});
    }
    CATS.forEach(function(c){ sectionItems(c.key).forEach(function(it){ add(it, c.key, secDate(c.key)); }); });
    arr(S.pool).forEach(function(p){ add(p.item, p.cat, p.date); });
    arr(S.active).forEach(function(p){ add(p.item, p.cat, p.date); });
    return out;
  }
  function deadlineList(){
    return campaignPool().filter(function(p){
      var n = p.item.deadline ? daysLeft(p.item.deadline) : null;
      var s = p.item.start ? daysLeft(p.item.start) : null;
      return n != null && n >= 0 && n <= DEADLINE_DAYS && !(s != null && s > 0);
    }).sort(function(a, b){ return daysLeft(a.item.deadline) - daysLeft(b.item.deadline); });
  }
  function startList(){
    return campaignPool().filter(function(p){
      var s = p.item.start ? daysLeft(p.item.start) : null;
      return s != null && s > 0 && s <= START_DAYS && !isExpired(p.item);
    }).sort(function(a, b){ return daysLeft(a.item.start) - daysLeft(b.item.start); });
  }

  // ---------- 部品 ----------
  function reg(item, cat, date){ var k = itemKey(item, cat, date); S.reg[k] = {item:item, cat:cat, date:date}; return k; }
  function thumbHTML(item, cat, cls){
    var img = safeImg(item.image);
    return '<span class="' + cls + ' c-' + esc(cat) + '"><span class="ph" aria-hidden="true">' + esc(CAT_BY[cat] ? CAT_BY[cat].ph : "") + '</span>' +
      (img ? '<img src="' + esc(img) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">' : "") + '</span>';
  }
  function whenBadges(item){
    var out = [];
    var s = item.start ? daysLeft(item.start) : null;
    var n = item.deadline ? daysLeft(item.deadline) : null;
    if (s != null && s > 0) out.push('<span class="badge start">' + esc(fmtMD(item.start)) + 'から</span>');
    if (n != null && n >= 0 && !(s != null && s > 0)) {
      if (n === 0) out.push('<span class="badge urgent">今日まで</span>');
      else if (n <= 3) out.push('<span class="badge urgent">あと' + n + '日</span>');
      else if (n <= DEADLINE_DAYS) out.push('<span class="badge soon">あと' + n + '日</span>');
      else out.push('<span class="badge">' + esc(fmtMD(item.deadline)) + 'まで</span>');
    }
    if (item.paid) out.push('<span class="badge paid">' + (/newspicks/i.test(item.source || "") ? "NP会員" : "日経会員") + '</span>');
    return out.join("");
  }
  function metaLine(item, cat, showCat){
    var parts = [];
    if (showCat && CAT_BY[cat]) parts.push('<span class="badge cat c-' + esc(cat) + '">' + esc(CAT_BY[cat].tab) + '</span>');
    parts.push(whenBadges(item));
    parts.push('<span class="src">' + esc(item.source || "出典不明") + '</span>');
    if (item.published) parts.push('<span>' + esc(fmtMD(item.published)) + '</span>');
    return '<span class="meta-line">' + parts.join("") + '</span>';
  }
  function rowHTML(item, cat, date, showCat){
    var k = reg(item, cat, date);
    return '<li class="' + (S.read[k] ? "is-read" : "") + '"><button class="row" data-open="' + esc(k) + '">' +
      '<span class="row-body"><span class="row-title">' + esc(item.title) + '</span>' + metaLine(item, cat, showCat) + '</span>' +
      thumbHTML(item, cat, "thumb") + '</button></li>';
  }
  function heroHTML(item, cat, date, showCat){
    var k = reg(item, cat, date);
    return '<button class="hero ' + (S.read[k] ? "is-read" : "") + '" data-open="' + esc(k) + '">' + thumbHTML(item, cat, "hero-img") +
      '<span class="hero-body"><span class="hero-title">' + esc(item.title) + '</span>' +
      (item.summary ? '<span class="hero-sum">' + esc(item.summary) + '</span>' : "") + metaLine(item, cat, showCat) + '</span></button>';
  }
  function listHTML(list, showCat){
    return '<ul class="rows">' + list.map(function(p){ return rowHTML(p.item, p.cat, p.date, showCat); }).join("") + '</ul>';
  }

  // ---------- 描画 ----------
  function renderTabs(){
    var html = VIEWS.map(function(v){
      var label, n = "";
      if (v === "top") label = "まとめ";
      else if (v === "saved") { label = "保存"; var c = Object.keys(S.saved).length; if (c) n = '<span class="n">' + c + '</span>'; }
      else { label = CAT_BY[v].tab; var u = unreadCount(v); if (u) n = '<span class="n">' + u + '</span>'; }
      return '<button class="tab c-' + v + '" role="tab" aria-selected="' + (S.view === v) + '" data-view="' + v + '">' + esc(label) + n + '</button>';
    }).join("");
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = html;
    var cur = tabs.querySelector('[aria-selected="true"]');
    if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({block:"nearest", inline:"nearest"}); } catch(e){} }
  }

  function renderEdition(){
    var sel = document.getElementById("edition");
    var dates = S.index ? arr(S.index.dates).slice().sort().reverse() : [];
    if (!dates.length && S.date) dates = [S.date];
    if (!dates.length) { sel.innerHTML = '<option>' + (S.status === "loading" ? "読み込み中" : "まだありません") + '</option>'; sel.disabled = true; return; }
    sel.disabled = false;
    sel.innerHTML = dates.map(function(d, i){
      return '<option value="' + esc(d) + '"' + (d === S.date ? " selected" : "") + '>' + esc(fmtShort(d)) + (i === 0 ? " 最新" : "") + '</option>';
    }).join("");
  }

  function stateBlock(){
    var skel = '<div class="skel" aria-hidden="true"><span class="t"><i></i><i></i><i></i></span><i class="p"></i></div>';
    if (S.status === "nodb") return '<div class="empty"><h2>ニュースを表示できません</h2><p>このページは claude.ai にサインインした状態で開くと、毎朝のニュースが表示されます。</p></div>';
    if (S.status === "error") return '<div class="empty"><h2>ニュースを読み込めませんでした</h2><p>しばらくしてからページを開き直してください。（' + esc(S.err || "unknown") + '）</p></div>';
    if (S.status === "empty") return '<div class="empty"><h2>最初の朝刊を準備しています</h2><p>毎朝6時ごろ、インスタ運用・クレカとマイル・不動産・AI・お得キャンペーンのニュースがここに届きます。</p></div>';
    if (S.status === "loading" || !S.sectionsReady) {
      return (S.slow ? '<p class="notice">ニュースの読み込みに時間がかかっています。通信状況を確かめてください。</p>' : "") + skel + skel + skel;
    }
    return null;
  }

  function renderTop(){
    var date = S.date;
    var total = 0;
    CATS.forEach(function(c){ total += sectionItems(c.key).length; });
    var upd = latestUpdate();
    var html = '<div class="dateline c-top"><h1>' + esc(fmtDay(date, true)) + 'の朝刊</h1><span class="meta">' +
      [upd ? fmtTime(upd) + " 更新" : "", total + "本"].filter(Boolean).join(" · ") + '</span></div>';
    if (S.index && S.index.latest && date !== S.index.latest) html += '<p class="notice">過去の号を表示しています。右上から最新の号に戻れます。</p>';
    html += pushHTML();
    if (isLatest()) {
      var probs = CATS.filter(function(c){ return catProblem(c.key); });
      if (probs.length) {
        var running = probs.every(function(c){ return catProblem(c.key).msg === "いま集めています"; });
        var hasOld = probs.some(function(c){ return S.sections[c.key]; });
        html += '<p class="notice warn">' + esc(probs.map(function(c){ return c.tab; }).join("・")) +
          (running ? "の今日の分をいま集めています。" : "は今日の分がまだ届いていません。7時・9時・12時に自動で取り直します。") +
          (hasOld ? "届くまで前の日の分を出しています。" : "") + '</p>';
      }
    }

    // 大見出し：最初に記事があるジャンルの1本目
    var heroCat = null;
    for (var i = 0; i < CATS.length; i++) { if (sectionItems(CATS[i].key).length) { heroCat = CATS[i].key; break; } }
    if (heroCat) html += heroHTML(sectionItems(heroCat)[0], heroCat, secDate(heroCat), true);

    var dl = deadlineList();
    if (dl.length) {
      html += '<section class="panel c-top"><div class="panel-head"><h2><span class="dot" style="background:var(--urgent)"></span>もうすぐ締切</h2><span class="count">' + DEADLINE_DAYS + '日以内 · ' + dl.length + '件</span></div>' +
        listHTML(dl.slice(0, 15), true) + '</section>';
    }
    var st = startList();
    if (st.length) {
      html += '<section class="panel c-top"><div class="panel-head"><h2><span class="dot" style="background:var(--ai)"></span>これから始まる</h2><span class="count">' + st.length + '件</span></div>' +
        listHTML(st.slice(0, 12), true) + '</section>';
    }

    CATS.forEach(function(c){
      var its = sectionItems(c.key);
      var sec = S.sections[c.key];
      var rows = its.slice(c.key === heroCat ? 1 : 0, (c.key === heroCat ? 1 : 0) + 5);
      html += '<section class="panel c-' + c.key + '"><div class="panel-head"><h2><span class="dot"></span>' + esc(c.title) +
        (sec && sec.date !== date ? ' <span class="count">' + esc(fmtDay(sec.date)) + 'の分</span>' : "") + '</h2>' +
        (its.length ? '<button class="more-link" data-view="' + c.key + '">' + its.length + '本すべて ›</button>' : "") + '</div>' +
        (sec && sec.lead ? '<p class="panel-lead">' + esc(sec.lead) + '</p>' : "") +
        (rows.length ? listHTML(rows.map(function(it){ return {item:it, cat:c.key, date:secDate(c.key)}; }), false) :
          '<p class="panel-lead">この日はまだ届いていません。</p>') + '</section>';
    });
    return html;
  }

  // 毎朝7時の通知（公開サイトをホーム画面に追加したときだけ使える）
  function pushHTML(){
    if (S.mode !== "static" || !S.push) return "";
    if (S.push === "off" || S.push === "error") {
      return (S.push === "error" ? '<p class="notice warn">' + esc(S.pushMsg || "通知をオンにできませんでした。もう一度押してください。") + '</p>' : "") +
        '<button class="push-cta" data-push="1">' + BELL + '<span><b>毎朝7時の通知を受け取る</b><small>その日の本数と、締切が近いキャンペーンをお知らせします</small></span></button>';
    }
    if (S.push === "busy") return '<button class="push-cta" disabled>' + BELL + '<span><b>通知の設定をしています…</b><small>「許可」を押してください</small></span></button>';
    if (S.push === "need-home") return '<p class="notice">毎朝7時の通知は、ホーム画面に追加した「朝刊」のアイコンから開くとオンにできます。</p>';
    if (S.push === "denied") return /iPhone|iPad|iPod/.test(navigator.userAgent) ?
      '<p class="notice warn">通知が止められています。iPhone の「設定」→「通知」→「朝刊」で、通知を許可にしてください。</p>' :
      '<p class="notice warn">このブラウザでは通知が止められています。iPhone のホーム画面の「朝刊」から開くと、毎朝7時の通知をオンにできます。</p>';
    if (S.push === "on" && S.pushMsg) return '<p class="notice">' + esc(S.pushMsg) + '</p>';
    return "";
  }
  function b64uToBytes(s){
    var b = atob(String(s).replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
    var a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a;
  }
  // 通知の宛先を Mac に渡す（中継：ntfy.sh）。同じ宛先は一度だけ送る
  function relaySub(sub, force){
    var ep = sub && sub.endpoint; if (!ep || !S.pushCfg) return Promise.resolve();
    var last = ""; try { last = localStorage.getItem("nken-chokan-push-endpoint") || ""; } catch(e){}
    if (!force && last === ep) return Promise.resolve();
    return fetch("https://ntfy.sh/" + encodeURIComponent(S.pushCfg.relayTopic), {method: "POST", body: JSON.stringify(sub)}).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      try { localStorage.setItem("nken-chokan-push-endpoint", ep); } catch(e){}
    });
  }
  async function initPush(){
    if (!("serviceWorker" in navigator)) return;
    var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    try { S.swReg = await navigator.serviceWorker.register("sw.js"); } catch(e){ return; }
    if (!("PushManager" in window) || !("Notification" in window)) { if (isIOS && !standalone) { S.push = "need-home"; render(); } return; }
    try { S.pushCfg = await getJSON("push-config.json"); } catch(e){ return; }
    if (Notification.permission === "denied") { S.push = "denied"; render(); return; }
    var sub = null; try { sub = await S.swReg.pushManager.getSubscription(); } catch(e){}
    if (sub && Notification.permission === "granted") { S.push = "on"; relaySub(sub).catch(function(){}); }
    else S.push = "off";
    render();
  }
  function enablePush(){
    if (!S.pushCfg || !("Notification" in window)) return;
    S.push = "busy"; render();
    Notification.requestPermission().then(async function(perm){
      if (perm !== "granted") { S.push = perm === "denied" ? "denied" : "off"; render(); return; }
      try {
        var reg = await navigator.serviceWorker.ready;
        var sub = await reg.pushManager.getSubscription();
        if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64uToBytes(S.pushCfg.vapidPublicKey)});
        await relaySub(sub, true);
        S.push = "on"; S.pushMsg = "通知をオンにしました。毎朝7時に届きます。";
      } catch(e) {
        S.push = "error"; S.pushMsg = "通知をオンにできませんでした（" + (e && e.message ? e.message : "不明") + "）。もう一度押してください。";
      }
      render();
    });
  }

  function renderCat(cat){
    var c = CAT_BY[cat], sec = S.sections[cat], items = sectionItems(cat);
    var html = '<div class="dateline c-' + cat + '"><h1>' + esc(c.title) + '</h1>';
    var prob = isLatest() ? catProblem(cat) : null;
    if (!sec) return html + '<span class="meta">' + esc(fmtDay(S.date, true)) + '</span></div>' +
      (prob ? '<p class="notice warn">' + esc(prob.msg) + '</p>' : "") +
      '<div class="empty"><h2>この日の分はまだ届いていません</h2><p>毎朝6時ごろに更新されます。右上から別の日を選べます。</p></div>';
    html += '<span class="meta">' + [fmtDay(sec.date, true), items.length + "本", sec.updated_at ? fmtTime(sec.updated_at) + " 更新" : ""].filter(Boolean).join(" · ") + '</span></div>';
    if (sec.date !== S.date) html += '<p class="notice warn">' + esc(fmtDay(S.date)) + 'の分は' + esc(prob ? prob.msg : "まだ届いていません") + '。いまは' + esc(fmtDay(sec.date)) + 'の分を出しています。</p>';
    if (sec.brief) html += '<div class="brief c-' + cat + '"><b>今日の動き</b><p>' + esc(sec.brief) + '</p></div>';
    var inds = arr(sec.indicators).filter(function(x){ return x && x.label && x.value; });
    if (inds.length) {
      html += '<div class="indicators">' + inds.map(function(x){
        var dir = x.dir === "up" || x.dir === "down" ? x.dir : "flat";
        var arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "→";
        var u = safeUrl(x.url);
        var src = [x.period, x.source].filter(Boolean).map(esc).join(" · ");
        return '<div class="ind"><span class="ind-label">' + esc(x.label) + '</span><span class="ind-value">' + esc(x.value) + '</span>' +
          (x.change ? '<span class="ind-change ' + dir + '">' + arrow + ' ' + esc(x.change) + (x.note ? ' <small>' + esc(x.note) + '</small>' : "") + '</span>' : "") +
          (src ? '<span class="ind-src">' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + src + '</a>' : src) + '</span>' : "") + '</div>';
      }).join("") + '</div>';
    }
    var hot = arr(sec.hot).filter(Boolean);
    if (hot.length) html += '<div class="brief c-' + cat + '" style="background:transparent;padding:0"><b>いま熱いキーワード</b><div class="hot">' + hot.slice(0, 10).map(function(t){ return '<span>' + esc(t) + '</span>'; }).join("") + '</div></div>';
    if (!items.length) return html + '<div class="empty"><h2>今日はこのジャンルのニュースがありません</h2><p>大きな動きがない日は、まとめだけを載せています。</p></div>';

    var mains = items.filter(function(it){ return (it.tier || "main") === "main"; });
    var mores = items.filter(function(it){ return it.tier === "more"; });
    if (!mains.length) { mains = items; mores = []; }
    html += heroHTML(mains[0], cat, sec.date, false);
    if (mains.length > 1) html += '<section class="panel c-' + cat + '">' + listHTML(mains.slice(1).map(function(it){ return {item:it, cat:cat, date:sec.date}; }), false) + '</section>';
    if (mores.length) {
      html += '<h2 class="subhead">ほかの新着<small>' + mores.length + '本</small></h2>' +
        '<section class="panel c-' + cat + '">' + listHTML(mores.map(function(it){ return {item:it, cat:cat, date:sec.date}; }), false) + '</section>';
    }
    return html;
  }

  function renderSaved(){
    var list = Object.keys(S.saved).map(function(k){ return S.saved[k]; }).filter(function(v){ return v && v.item; });
    list.sort(function(a, b){ return String(b.saved_at || "").localeCompare(String(a.saved_at || "")); });
    var html = '<div class="dateline c-saved"><h1>保存した記事</h1><span class="meta">' + list.length + '本</span></div>';
    if (!S.uid) return html + '<div class="empty"><h2>保存はこの画面では使えません</h2><p>claude.ai にサインインして開くと、記事を保存できます。</p></div>';
    if (!list.length) return html + '<div class="empty"><h2>まだ保存した記事はありません</h2><p>記事を開いて「保存」を押すと、ここに残ります。' +
      (S.mode === "static" ? "保存はこの端末のブラウザに残ります。" : "スマホとパソコンで同じ一覧が見られます。") + '</p></div>';
    return html + '<section class="panel c-saved">' + listHTML(list.map(function(v){ return {item:v.item, cat:v.cat, date:v.date}; }), true) + '</section>';
  }

  function renderDetail(){
    var box = document.getElementById("detail");
    var d = S.detail && S.reg[S.detail];
    if (!d) { box.hidden = true; box.innerHTML = ""; document.body.classList.remove("locked"); return; }
    var it = d.item, cat = d.cat, k = S.detail;
    var url = safeUrl(it.url);
    var img = safeImg(it.image);
    var saveId = "sv-" + k, saved = !!S.saved[saveId];
    var when = [];
    if (it.start && daysLeft(it.start) > 0) when.push('<span class="st">開始 ' + esc(fmtDay(it.start, true)) + '（あと' + daysLeft(it.start) + '日）</span>');
    if (it.deadline && daysLeft(it.deadline) >= 0) when.push('<span class="dl">締切 ' + esc(fmtDay(it.deadline, true)) + (daysLeft(it.deadline) === 0 ? "（今日まで）" : "（あと" + daysLeft(it.deadline) + "日）") + '</span>');
    var tags = arr(it.tags).slice(0, 3).map(function(t){ return '<span class="badge">' + esc(t) + '</span>'; }).join("");
    var pts = arr(it.points).filter(Boolean);
    box.className = "detail c-" + cat;
    box.innerHTML =
      '<div class="d-bar"><div class="wrap"><button class="d-back" data-close="1">' + BACK + '戻る</button><span class="d-cat">' + esc(CAT_BY[cat] ? CAT_BY[cat].title : "") + '</span></div></div>' +
      '<article class="wrap d-body">' +
        (img ? '<span class="d-img">' + '<img src="' + esc(img) + '" alt="" decoding="async" referrerpolicy="no-referrer"></span>' : "") +
        '<span class="meta-line">' + (it.region ? '<span class="badge">' + esc(it.region) + '</span>' : "") + tags + (it.paid ? '<span class="badge paid">会員記事</span>' : "") + '</span>' +
        '<h1 class="d-title">' + esc(it.title) + '</h1>' +
        '<span class="meta-line"><span>' + esc(it.source || "出典不明") + '</span>' + (it.published ? '<span>' + esc(fmtDay(it.published)) + '</span>' : "") + '</span>' +
        (when.length ? '<div class="d-when">' + when.join("") + '</div>' : "") +
        (it.paid_hidden ? '<p class="notice">会員向けの記事なので、公開ページには要約を載せていません。元記事を会員として開いて読んでください。</p>' : "") +
        (it.summary ? '<p class="d-sum">' + esc(it.summary) + '</p>' : "") +
        (pts.length ? '<ul class="points">' + pts.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join("") + '</ul>' : "") +
        (it.why ? '<div class="why"><b>使いどころ</b><p>' + esc(it.why) + '</p></div>' : "") +
        '<div class="d-actions">' +
          (url ? '<a class="btn primary" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">元記事を開く' + (it.lang && it.lang !== "ja" ? "（英語）" : "") + ' ↗</a>' : "") +
          ((S.db || S.mode === "static") && S.uid ? '<button class="btn" data-save="' + esc(k) + '" aria-pressed="' + saved + '"' + (S.saving[saveId] ? " disabled" : "") + '>' + (saved ? STAR + "保存済み" : STAR_O + "保存") + '</button>' : "") +
        '</div>' +
        '<p class="d-src">出典：' + esc(it.source || "出典不明") + (url ? '（' + esc(hostOf(url)) + '）' : "") + (img ? '<br>画像：元記事のサイトより' : "") + '</p>' +
      '</article>';
    box.hidden = false;
    document.body.classList.add("locked");
  }

  function render(){
    S.reg = S.detail && S.reg[S.detail] ? (function(o){ var r = {}; r[S.detail] = o; return r; })(S.reg[S.detail]) : {};
    renderTabs();
    renderEdition();
    var main = document.getElementById("main");
    var body;
    if (S.view === "saved" && S.status !== "nodb" && S.status !== "loading") body = renderSaved();
    else {
      var st = stateBlock();
      if (st) body = st;
      else if (S.view === "top") body = renderTop();
      else body = renderCat(S.view);
    }
    main.innerHTML = body;
    renderDetail();
  }

  // ---------- 操作 ----------
  function setView(v){
    if (VIEWS.indexOf(v) < 0) return;
    S.view = v;
    try { history.replaceState(history.state, "", "#" + v); } catch(e){}
    render();
    window.scrollTo(0, 0);
  }
  function openDetail(k){
    if (!S.reg[k]) return;
    S.detail = k; markRead(k);
    try { history.pushState({detail:k}, "", location.hash || "#" + S.view); S.pushed = true; } catch(e){ S.pushed = false; }
    render();
    var box = document.getElementById("detail"); box.scrollTop = 0;
    var back = box.querySelector(".d-back"); if (back) back.focus({preventScroll:true});
  }
  function closeDetail(fromPop){
    if (!S.detail) return;
    S.detail = null;
    if (!fromPop && S.pushed) { S.pushed = false; try { history.back(); } catch(e){} }
    S.pushed = false;
    render();
  }
  window.addEventListener("popstate", function(){ if (S.detail) closeDetail(true); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && S.detail) closeDetail(false); });
  // 画像が読めなかったら外して、ジャンルの色の札を出す
  document.addEventListener("error", function(e){
    var t = e.target;
    if (t && t.tagName === "IMG" && t.closest && t.closest(".thumb,.hero-img,.d-img")) {
      var src = t.getAttribute("src"); if (src) S.badImg[src] = 1;
      var holder = t.closest(".d-img"); t.remove(); if (holder) holder.remove();
    }
  }, true);

  async function toggleSave(btn){
    var k = btn.getAttribute("data-save");
    var d = S.reg[k]; if (!d) return;
    var id = "sv-" + k;
    var item = JSON.parse(JSON.stringify(d.item));
    if (S.mode === "static") {
      // 公開サイトでは、保存はこの端末のブラウザに残す
      if (S.saved[id]) delete S.saved[id];
      else S.saved[id] = {item: item, cat: d.cat, date: d.date, saved_at: new Date().toISOString()};
      try { localStorage.setItem("nken-chokan-saved", JSON.stringify(S.saved)); } catch(e){}
      render();
      return;
    }
    if (!S.db || !S.uid || S.saving[id]) return;
    var ref = S.db.collection("data/users/" + S.uid).doc(id);
    S.saving[id] = 1; render();
    try {
      if (S.saved[id]) await ref.delete();
      else await ref.set({item: item, cat: d.cat, date: d.date, saved_at: new Date().toISOString()});
    } catch(e) { S.err = e && e.code; }
    delete S.saving[id]; render();
  }

  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-view],[data-open],[data-save],[data-close],[data-push]");
    if (!t) return;
    if (t.hasAttribute("data-push")) { enablePush(); return; }
    if (t.hasAttribute("data-save")) { e.preventDefault(); toggleSave(t); return; }
    if (t.hasAttribute("data-close")) { closeDetail(false); return; }
    if (t.hasAttribute("data-open")) { openDetail(t.getAttribute("data-open")); return; }
    if (t.hasAttribute("data-view")) setView(t.getAttribute("data-view"));
  });
  document.getElementById("edition").addEventListener("change", function(e){
    var d = e.target.value;
    var latest = S.index && S.index.latest;
    setDate(d, d === latest);
  });

  // ---------- データ ----------
  function setDate(d, follow){
    S.followLatest = !!follow;
    if (!d || d === S.date) { render(); return; }
    S.date = d; S.sections = {}; S.pool = []; S.sectionsReady = false;
    if (S.mode === "static") { loadStaticDate(d); render(); return; }
    if (S.unsubSections) S.unsubSections();
    // その日までの新しい順に読み、ジャンルごとに一番新しい分を使う（その日の分が欠けたら前の日の分を出す）
    S.unsubSections = S.db.collection("sections").where("date", "<=", d).orderBy("date", "desc").limit(25).onSnapshot(function(snap){
      var next = {}, pool = [];
      snap.docs.forEach(function(doc){
        var v = doc.exists ? doc.data() : null;
        if (!v || !v.cat || !CAT_BY[v.cat]) return;
        if (!next[v.cat]) next[v.cat] = v;
        arr(v.items).forEach(function(it){ if (it && (it.deadline || it.start)) pool.push({item:it, cat:v.cat, date:v.date}); });
      });
      S.sections = next; S.pool = pool; S.sectionsReady = true; render();
    }, function(err){ S.status = "error"; S.err = err && err.code; render(); });
    render();
  }

  // 公開サイト（claude.ai の外）では、サイトに置いたデータファイルを読む
  function getJSON(path){
    return fetch(path + (path.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), {cache: "no-store"}).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  function loadStaticDate(d){
    getJSON("data/" + d + ".json").then(function(b){
      if (S.date !== d) return;
      var next = {};
      Object.keys((b && b.sections) || {}).forEach(function(c){ var v = b.sections[c]; if (v && CAT_BY[c]) next[c] = v; });
      S.sections = next; S.sectionsReady = true; render();
    }).catch(function(){ if (S.date !== d) return; S.sections = {}; S.sectionsReady = true; render(); });
  }
  function loadStaticIndex(){
    getJSON("data/active.json").then(function(a){ S.active = arr(a && a.items); render(); }).catch(function(){});
    return getJSON("data/index.json").then(function(idx){
      S.index = idx; S.status = "ready"; S.slow = false;
      var latest = idx.latest || arr(idx.dates).slice().sort().reverse()[0];
      if (!latest) { S.status = "empty"; render(); return; }
      if (!S.date || S.followLatest) {
        if (S.date === latest) loadStaticDate(latest); else setDate(latest, true);
      }
      render();
    });
  }
  function bootStatic(){
    S.mode = "static"; S.uid = "local";
    try { S.saved = JSON.parse(localStorage.getItem("nken-chokan-saved") || "{}") || {}; } catch(e){ S.saved = {}; }
    var timer = setTimeout(function(){ if (S.status === "loading") { S.slow = true; render(); } }, 10000);
    loadStaticIndex().then(function(){ clearTimeout(timer); }).catch(function(){
      clearTimeout(timer); S.status = "error"; S.err = "データを読めません"; render();
    });
    initPush().catch(function(){});
    // アプリに戻ってきたとき、新しい号が出ていれば読み直す（記事画面を開いている間は読み直さない）
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible" && S.status !== "loading" && !S.detail) loadStaticIndex().catch(function(){});
    });
  }

  async function boot(){
    render();
    if (!(window.claude && window.claude.use)) { bootStatic(); return; }
    var db = null;
    try { db = await window.claude.use("db"); } catch(e){ db = null; }
    if (!db) { S.status = "nodb"; render(); return; }
    S.db = db;
    try {
      var user = await window.claude.use("user");
      S.uid = user ? await user.id() : null;
    } catch(e){ S.uid = null; }

    var timer = setTimeout(function(){ if (S.status === "loading" || !S.sectionsReady) { S.slow = true; render(); } }, 10000);
    db.doc("meta/index").onSnapshot(function(snap){
      if (!snap.metadata.fromCache) { clearTimeout(timer); S.slow = false; }
      if (!snap.exists) {
        if (!snap.metadata.fromCache) { S.status = "empty"; render(); }
        return;
      }
      var d = snap.data() || {};
      S.index = d;
      S.status = "ready";
      var dates = arr(d.dates).slice().sort().reverse();
      var latest = d.latest || dates[0];
      if (!S.date || S.followLatest) setDate(latest, true); else render();
    }, function(err){ clearTimeout(timer); S.status = "error"; S.err = err && err.code; render(); });

    if (S.uid) {
      db.collection("data/users/" + S.uid).onSnapshot(function(snap){
        var next = {};
        snap.docs.forEach(function(doc){ if (doc.exists && /^sv-/.test(doc.id)) next[doc.id] = doc.data(); });
        S.saved = next; render();
      }, function(){ /* 保存が使えないときは一覧を空のままにする */ });
    }
  }

  boot();
})();
</script>

</body></html>
