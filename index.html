</head><body>
<title>エヌケン朝刊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* レイアウト：スマホ1カラムの朝刊アプリ。固定の題字とジャンルタブの下に、今日の要点 → 記事カード。幅は最大680pxで中央 */
:root{
  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --sunk:#E4E9F1;
  --ink:#111A2E;
  --ink-2:#414C64;
  --ink-3:#6E7990;
  --line:#D9DFE9;
  --navy:#1C2C58;
  --navy-ink:#FFFFFF;
  --ig:#B8235A; --ig-bg:#FBE8EF;
  --card:#8A5900; --card-bg:#FAF0D9;
  --re:#20704A; --re-bg:#E1F2E8;
  --ai:#1F4FB5; --ai-bg:#E5ECFA;
  --otoku:#BC3D0A; --otoku-bg:#FCEADD;
  --up:#C42B2B; --down:#1D5FC0;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#141B2D; --sunk:#1B2338;
    --ink:#E9EDF5; --ink-2:#B3BCCD; --ink-3:#8590A6; --line:#263049;
    --navy:#AFC1F4; --navy-ink:#0B1020;
    --ig:#F27AA6; --ig-bg:#3A1828; --card:#E8B456; --card-bg:#33270F;
    --re:#6BCB97; --re-bg:#12301F; --ai:#8AACF6; --ai-bg:#16244A;
    --otoku:#F59562; --otoku-bg:#3A1F12;
    --up:#F27B7B; --down:#7FB0F5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#141B2D; --sunk:#1B2338;
  --ink:#E9EDF5; --ink-2:#B3BCCD; --ink-3:#8590A6; --line:#263049;
  --navy:#AFC1F4; --navy-ink:#0B1020;
  --ig:#F27AA6; --ig-bg:#3A1828; --card:#E8B456; --card-bg:#33270F;
  --re:#6BCB97; --re-bg:#12301F; --ai:#8AACF6; --ai-bg:#16244A;
  --otoku:#F59562; --otoku-bg:#3A1F12;
  --up:#F27B7B; --down:#7FB0F5;
  color-scheme:dark;
}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.c-instagram{--c:var(--ig);--cb:var(--ig-bg)}
.c-card{--c:var(--card);--cb:var(--card-bg)}
.c-realestate{--c:var(--re);--cb:var(--re-bg)}
.c-ai{--c:var(--ai);--cb:var(--ai-bg)}
.c-otoku{--c:var(--otoku);--cb:var(--otoku-bg)}
.c-top,.c-saved{--c:var(--navy);--cb:var(--sunk)}

/* 題字とタブ */
.masthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{display:grid;grid-template-columns:repeat(5,4px);gap:2px;height:22px;flex:none}
.brand-mark i{display:block;border-radius:2px}
.brand-mark i:nth-child(1){background:var(--ig)}
.brand-mark i:nth-child(2){background:var(--card)}
.brand-mark i:nth-child(3){background:var(--re)}
.brand-mark i:nth-child(4){background:var(--ai)}
.brand-mark i:nth-child(5){background:var(--otoku)}
.brand-name{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.02em;color:var(--navy);line-height:1;white-space:nowrap}
.edition{position:relative;flex:none}
.edition select{appearance:none;-webkit-appearance:none;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:6px 30px 6px 12px;cursor:pointer;max-width:46vw}
.edition::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.tab .n{font-size:11.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;background:var(--c);color:var(--surface);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.tab[aria-selected="true"] .n{background:var(--surface);color:var(--c)}

/* 本文 */
.main{padding-block:18px 28px;display:flex;flex-direction:column;gap:22px}
.hero h1{font-family:var(--display);font-weight:900;font-size:25px;line-height:1.3;margin:0;text-wrap:balance}
.hero .meta{margin:6px 0 0;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.notice{font-size:13.5px;color:var(--ink-2);background:var(--sunk);border-radius:10px;padding:10px 12px;margin:0}
.block{display:flex;flex-direction:column;gap:10px}
.block-title{font-family:var(--display);font-weight:700;font-size:17px;margin:0;display:flex;align-items:baseline;gap:8px}
.block-title small{font-family:var(--body);font-weight:400;font-size:12.5px;color:var(--ink-3)}

/* 今日の5行 */
.leads{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.leads li+li{border-top:1px solid var(--line)}
.lead{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 14px;text-align:left}
.lead:hover{background:var(--sunk)}
.lead-main{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.pill{display:inline-block;font-size:12px;font-weight:700;line-height:1;padding:5px 8px;border-radius:6px;color:var(--c);background:var(--cb);white-space:nowrap}
.lead-text{font-weight:600;font-size:15px;line-height:1.6;min-width:0}
.chev{color:var(--ink-3);font-size:18px;line-height:1.3}
@media (min-width:560px){
  .lead-main{display:grid;grid-template-columns:7.4em minmax(0,1fr);align-items:start;gap:10px}
  .lead .pill{text-align:center;margin-top:2px}
}

/* 締切 */
.deadlines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dl{width:100%;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dl-days{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;background:var(--cb);color:var(--c);padding:6px 0;line-height:1.1;font-variant-numeric:tabular-nums}
.dl-days b{font-family:var(--display);font-size:22px;font-weight:900}
.dl-days span{font-size:11px;font-weight:700}
.dl-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.dl-title{font-weight:700;font-size:14.5px;line-height:1.5}
.dl-sub{font-size:12px;color:var(--ink-3)}

/* ジャンルの頭 */
.cat-head{display:flex;flex-direction:column;gap:12px}
.cat-head h1{font-family:var(--display);font-weight:900;font-size:25px;line-height:1.3;margin:0;color:var(--c)}
.cat-head .meta{margin:-6px 0 0;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.brief{background:var(--cb);border-radius:14px;padding:14px 16px}
.brief-label{display:block;font-size:12px;font-weight:700;color:var(--c);letter-spacing:.06em;margin-bottom:4px}
.brief p{margin:0;font-size:15.5px;line-height:1.75;color:var(--ink)}
.indicators{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ind{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ind-label{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.45}
.ind-value{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ind-change{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.ind-change.up{color:var(--up)} .ind-change.down{color:var(--down)} .ind-change.flat{color:var(--ink-3)}
.ind-src{font-size:11.5px;color:var(--ink-3);line-height:1.45;overflow-wrap:anywhere}
.ind-src a{color:var(--ink-3)}
.hot{display:flex;flex-wrap:wrap;gap:6px}
.hot span{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--c);color:var(--c);background:var(--surface)}

/* 記事カード */
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;scroll-margin-top:130px}
.card.is-open{border-color:var(--c)}
.card-main{padding:14px 16px 4px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:11.5px;font-weight:700;line-height:1;padding:4px 7px;border-radius:5px;background:var(--sunk);color:var(--ink-2)}
.tag.cat{color:var(--c);background:var(--cb)}
.tag.dl{background:var(--otoku);color:var(--surface)}
.tag.dl.over{background:var(--sunk);color:var(--ink-3)}
.card-title{font-family:var(--display);font-weight:700;font-size:17.5px;line-height:1.5;margin:0;text-wrap:pretty}
.card.is-read:not(.is-open) .card-title{color:var(--ink-3)}
.card-summary{margin:0;color:var(--ink-2);font-size:15px;line-height:1.75}
.card-detail{padding:4px 16px 2px;display:flex;flex-direction:column;gap:12px;animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}
.points{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px;font-size:15px;line-height:1.7}
.points li::marker{color:var(--c)}
.why{background:var(--cb);border-radius:10px;padding:10px 12px}
.why b{display:block;font-size:12px;color:var(--c);letter-spacing:.06em;margin-bottom:2px}
.why p{margin:0;font-size:14.5px;line-height:1.7}
.open-src{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;text-decoration:none;color:var(--surface);background:var(--c);padding:9px 14px;border-radius:999px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 8px 16px}
.src{display:block;font-size:12.5px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-block:6px}
a.src{color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.src-k{display:inline-block;font-size:11px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:6px;line-height:1.5;text-decoration:none}
.tag.paid{background:var(--navy);color:var(--navy-ink)}
.notice.warn{background:var(--otoku-bg);color:var(--ink)}
.lead-old{display:inline-block;font-size:11px;font-weight:700;color:var(--ink-3);margin-left:6px}
.save{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink-3);padding:8px 10px;border-radius:999px}
.save:hover{background:var(--sunk)}
.save svg{width:17px;height:17px}
.save[aria-pressed="true"]{color:var(--card)}
.save[disabled]{opacity:.5}

/* 空・読み込み */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 18px;text-align:center;color:var(--ink-2)}
.empty h2{font-family:var(--display);font-size:18px;margin:0 0 6px;color:var(--ink)}
.empty p{margin:0;font-size:14px}
.skel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.skel i{display:block;height:12px;border-radius:6px;background:var(--sunk)}
.skel i:nth-child(1){width:30%} .skel i:nth-child(2){height:18px;width:88%} .skel i:nth-child(3){width:96%} .skel i:nth-child(4){width:70%}
@media (prefers-reduced-motion:no-preference){.skel i{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.5}}

.foot{color:var(--ink-3);font-size:12px;line-height:1.7;padding-block:0 28px}
.foot p{margin:0}
@media (prefers-reduced-motion:reduce){.card-detail{animation:none}}
@media (min-width:560px){.indicators{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

<header class="masthead">
  <div class="wrap">
    <div class="mast-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">エヌケン朝刊</span>
      </div>
      <label class="edition">
        <span class="sr">読む日を選ぶ</span>
        <select id="edition"><option>読み込み中</option></select>
      </label>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="ジャンル"></nav>
  </div>
</header>

<main class="wrap main" id="main">
  <div class="skel" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="skel" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</main>

<footer class="wrap foot">
  <p>毎朝6時ごろ、Mac Studio が5つのジャンルのニュースを集め、日本語でまとめています。どの記事にも出典を付けています。有料の記事は日経と NewsPicks だけを使っています。キャンペーンの条件や数字は、申し込む前に元記事で確かめてください。</p>
</footer>

<script>
(function(){
  "use strict";

  var CATS = [
    {key:"instagram", tab:"インスタ", title:"Instagram運用"},
    {key:"card", tab:"クレカ・マイル", title:"クレカ・マイル"},
    {key:"realestate", tab:"不動産", title:"不動産の市況"},
    {key:"ai", tab:"AI", title:"AIの動き"},
    {key:"otoku", tab:"お得", title:"お得・キャンペーン"}
  ];
  var CAT_BY = {}; CATS.forEach(function(c){ CAT_BY[c.key] = c; });
  var VIEWS = ["top"].concat(CATS.map(function(c){ return c.key; }), ["saved"]);
  var WEEK = ["日","月","火","水","木","金","土"];
  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17.03 6.62 19.85l1.03-6L3.3 9.6l6-.9z"/></svg>';
  var STAR_O = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17.03 6.62 19.85l1.03-6L3.3 9.6l6-.9z"/></svg>';

  var S = {
    mode:"db", db:null, uid:null, status:"loading", slow:false, err:null,
    index:null, date:null, followLatest:true, sections:{}, sectionsReady:false, unsubSections:null,
    saved:{}, saving:{}, view:"top", open:{}, read:loadRead()
  };

  var h0 = (location.hash || "").replace("#","");
  if (VIEWS.indexOf(h0) >= 0) S.view = h0;

  // ---------- 小道具 ----------
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(ch){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
    });
  }
  function safeUrl(u){ return (typeof u === "string" && /^https?:\/\//i.test(u)) ? u : null; }
  function arr(v){ return Array.isArray(v) ? v : []; }
  function parseYMD(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
    return m ? {y:+m[1], m:+m[2], d:+m[3]} : null;
  }
  function fmtDay(s, withWeek){
    var p = parseYMD(s); if (!p) return "";
    var w = new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay();
    return p.m + "月" + p.d + "日" + (withWeek ? "（" + WEEK[w] + "）" : "");
  }
  function fmtShort(s){
    var p = parseYMD(s); if (!p) return "";
    var w = new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay();
    return p.m + "/" + p.d + "（" + WEEK[w] + "）";
  }
  function fmtTime(iso){
    var t = new Date(iso); if (isNaN(t)) return "";
    return t.getHours() + ":" + String(t.getMinutes()).padStart(2, "0");
  }
  function daysLeft(s){
    var p = parseYMD(s); if (!p) return null;
    var n = new Date();
    var today = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.round((Date.UTC(p.y, p.m - 1, p.d) - today) / 86400000);
  }
  function dlLabel(s){
    var n = daysLeft(s); if (n == null) return null;
    var p = parseYMD(s);
    if (n < 0) return {text:"終了", over:true, n:n};
    if (n === 0) return {text:"今日まで", n:n};
    if (n > 45) return {text:p.m + "/" + p.d + "まで", n:n};
    return {text:"あと" + n + "日", n:n};
  }
  function seg(s){ return String(s || "").replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 150) || "x"; }
  function itemKey(item, cat, date){ return seg(item.id || (date + "-" + cat + "-" + (item.url || item.title))); }

  function loadRead(){
    try { var a = JSON.parse(localStorage.getItem("nken-chokan-read") || "[]"); var o = {}; a.forEach(function(k){ o[k] = 1; }); return o; }
    catch(e){ return {}; }
  }
  function markRead(k){
    if (S.read[k]) return;
    S.read[k] = 1;
    try { var keys = Object.keys(S.read); localStorage.setItem("nken-chokan-read", JSON.stringify(keys.slice(-3000))); } catch(e){}
  }

  function sectionItems(cat){
    var sec = S.sections[cat];
    return sec ? arr(sec.items).filter(function(it){ return it && it.title; }) : [];
  }
  function secDate(cat){ var sec = S.sections[cat]; return (sec && sec.date) || S.date; }
  function unreadCount(cat){
    return sectionItems(cat).filter(function(it){ return !S.read[itemKey(it, cat, secDate(cat))]; }).length;
  }
  // 毎朝の取得の状態（meta/index の status）。見ている日の分だけ使う
  function statusFor(cat){
    var st = S.index && S.index.status;
    if (!st || st.date !== S.date || !st.cats) return null;
    return st.cats[cat] || null;
  }
  function isLatest(){ return !!(S.index && S.index.latest === S.date); }
  function catProblem(cat){
    var sec = S.sections[cat], st = statusFor(cat);
    var stale = !sec || sec.date !== S.date;
    var bad = st && st.state && st.state !== "ok";
    if (!stale && !bad) return null;
    var msg;
    if (st && st.state === "running") msg = "いま集めています";
    else if (st && st.state === "failed") msg = "取得に失敗しました" + (st.next ? "。" + st.next + "に自動で取り直します" : "");
    else msg = "まだ届いていません。7時・9時・12時に自動で取り直します";
    return {stale: stale, oldDate: sec && sec.date !== S.date ? sec.date : null, msg: msg, note: st && st.note};
  }
  function latestUpdate(){
    var best = "";
    CATS.forEach(function(c){ var s = S.sections[c.key]; if (s && s.updated_at && s.updated_at > best) best = s.updated_at; });
    return best;
  }

  // ---------- 描画 ----------
  function renderTabs(){
    var html = VIEWS.map(function(v){
      var label, n = "";
      if (v === "top") label = "まとめ";
      else if (v === "saved") { label = "保存"; var c = Object.keys(S.saved).length; if (c) n = '<span class="n">' + c + '</span>'; }
      else { label = CAT_BY[v].tab; var u = unreadCount(v); if (u) n = '<span class="n">' + u + '</span>'; }
      return '<button class="tab c-' + v + '" role="tab" aria-selected="' + (S.view === v) + '" data-view="' + v + '">' + esc(label) + n + '</button>';
    }).join("");
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = html;
    var cur = tabs.querySelector('[aria-selected="true"]');
    if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({block:"nearest", inline:"nearest"}); } catch(e){} }
  }

  function renderEdition(){
    var sel = document.getElementById("edition");
    var dates = S.index ? arr(S.index.dates).slice().sort().reverse() : [];
    if (!dates.length && S.date) dates = [S.date];
    if (!dates.length) { sel.innerHTML = '<option>' + (S.status === "loading" ? "読み込み中" : "まだありません") + '</option>'; sel.disabled = true; return; }
    sel.disabled = false;
    sel.innerHTML = dates.map(function(d, i){
      return '<option value="' + esc(d) + '"' + (d === S.date ? " selected" : "") + '>' + esc(fmtShort(d)) + (i === 0 ? " 最新" : "") + '</option>';
    }).join("");
  }

  function cardHTML(item, cat, date, opts){
    opts = opts || {};
    var k = itemKey(item, cat, date);
    var isOpen = !!S.open[k];
    var isRead = !!S.read[k];
    var saveId = "sv-" + k;
    var saved = !!S.saved[saveId];
    var tags = [];
    if (opts.showCat) tags.push('<span class="tag cat">' + esc(CAT_BY[cat] ? CAT_BY[cat].tab : cat) + '</span>');
    if (item.region) tags.push('<span class="tag">' + esc(item.region) + '</span>');
    arr(item.tags).slice(0, 3).forEach(function(t){ tags.push('<span class="tag">' + esc(t) + '</span>'); });
    if (item.paid) tags.push('<span class="tag paid">' + (/newspicks/i.test(item.source || "") ? "NewsPicks会員" : "日経会員") + '</span>');
    var dl = item.deadline ? dlLabel(item.deadline) : null;
    if (dl) tags.push('<span class="tag dl' + (dl.over ? " over" : "") + '">' + esc(dl.text) + '</span>');
    var url = safeUrl(item.url);
    var srcLine = [item.source || "出典不明", item.published ? fmtDay(item.published) : ""].filter(Boolean).join(" · ");
    var srcHTML = url ?
      '<a class="src" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"><span class="src-k">出典</span>' + esc(srcLine) + ' ↗</a>' :
      '<span class="src"><span class="src-k">出典</span>' + esc(srcLine) + '</span>';
    var detail = "";
    if (isOpen) {
      var pts = arr(item.points).filter(Boolean);
      detail = '<div class="card-detail">' +
        (item.paid_hidden ? '<p class="notice">会員向けの記事なので、公開ページには要約を載せていません。元記事を会員として開いて読んでください。</p>' : "") +
        (pts.length ? '<ul class="points">' + pts.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join("") + '</ul>' : "") +
        (item.why ? '<div class="why"><b>使いどころ</b><p>' + esc(item.why) + '</p></div>' : "") +
        (url ? '<a class="open-src" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">元記事を開く' + (item.lang && item.lang !== "ja" ? "（英語）" : "") + ' ↗</a>' : "") +
        '</div>';
    }
    var saveBtn = ((S.db || S.mode === "static") && S.uid) ?
      '<button class="save" data-save="' + esc(k) + '" data-cat="' + esc(cat) + '" data-date="' + esc(date) + '" aria-pressed="' + saved + '"' + (S.saving[saveId] ? " disabled" : "") + '>' + (saved ? STAR + "保存済み" : STAR_O + "保存") + '</button>' : "";
    return '<article class="card c-' + esc(cat) + (isOpen ? " is-open" : "") + (isRead ? " is-read" : "") + '" id="a-' + esc(k) + '">' +
      '<div class="card-main" role="button" tabindex="0" aria-expanded="' + isOpen + '" data-toggle="' + esc(k) + '">' +
        (tags.length ? '<div class="card-tags">' + tags.join("") + '</div>' : "") +
        '<h3 class="card-title">' + esc(item.title) + '</h3>' +
        (item.summary ? '<p class="card-summary">' + esc(item.summary) + '</p>' : "") +
      '</div>' + detail +
      '<div class="card-foot">' + srcHTML + saveBtn + '</div>' +
    '</article>';
  }

  function stateBlock(){
    if (S.status === "nodb") return '<div class="empty"><h2>ニュースを表示できません</h2><p>このページは claude.ai にサインインした状態で開くと、毎朝のニュースが表示されます。</p></div>';
    if (S.status === "error") return '<div class="empty"><h2>ニュースを読み込めませんでした</h2><p>しばらくしてからページを開き直してください。（' + esc(S.err || "unknown") + '）</p></div>';
    if (S.status === "empty") return '<div class="empty"><h2>最初の朝刊を準備しています</h2><p>毎朝6時ごろ、インスタ運用・クレカとマイル・不動産・AI・お得キャンペーンのニュースがここに届きます。</p></div>';
    if (S.status === "loading" || !S.sectionsReady) {
      return (S.slow ? '<p class="notice">ニュースの読み込みに時間がかかっています。通信状況を確かめてください。</p>' : "") +
        '<div class="skel" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="skel" aria-hidden="true"><i></i><i></i><i></i><i></i></div>';
    }
    return null;
  }

  function renderTop(){
    var date = S.date;
    var total = 0, unread = 0;
    CATS.forEach(function(c){ total += sectionItems(c.key).length; unread += unreadCount(c.key); });
    var upd = latestUpdate();
    var html = '<section class="hero"><h1>' + esc(fmtDay(date, true)) + 'の朝刊</h1><p class="meta">' +
      [upd ? fmtTime(upd) + " 更新" : "", total + "本", "未読 " + unread].filter(Boolean).join(" · ") + '</p></section>';
    if (S.index && S.index.latest && date !== S.index.latest) html += '<p class="notice">過去の号を表示しています。右上から最新の号に戻れます。</p>';
    if (isLatest()) {
      var probs = CATS.filter(function(c){ return catProblem(c.key); });
      if (probs.length) {
        var running = probs.every(function(c){ var p = catProblem(c.key); return p.msg === "いま集めています"; });
        var hasOld = probs.some(function(c){ return S.sections[c.key]; });
        html += '<p class="notice warn">' + esc(probs.map(function(c){ return c.tab; }).join("・")) +
          (running ? "の今日の分をいま集めています。" : "は今日の分がまだ届いていません。7時・9時・12時に自動で取り直します。") +
          (hasOld ? "届くまで前の日の分を出しています。" : "") + '</p>';
      }
    }

    var leads = CATS.map(function(c){
      var sec = S.sections[c.key];
      var text = sec ? (sec.lead || sec.brief || "") : "";
      if (!text) text = "この日はまだ届いていません";
      var old = sec && sec.date !== date ? '<span class="lead-old">' + esc(fmtDay(sec.date)) + 'の分</span>' : "";
      return '<li><button class="lead c-' + c.key + '" data-view="' + c.key + '"><span class="lead-main"><span class="pill">' + esc(c.tab) + '</span><span class="lead-text">' + esc(text) + old + '</span></span><span class="chev" aria-hidden="true">›</span></button></li>';
    }).join("");
    html += '<section class="block"><h2 class="block-title">今日の5行</h2><ul class="leads">' + leads + '</ul></section>';

    var dls = [];
    CATS.forEach(function(c){
      sectionItems(c.key).forEach(function(it){
        if (!it.deadline) return;
        var n = daysLeft(it.deadline);
        if (n == null || n < 0 || n > 60) return;
        dls.push({it:it, cat:c.key, n:n});
      });
    });
    dls.sort(function(a, b){ return a.n - b.n; });
    if (dls.length) {
      html += '<section class="block"><h2 class="block-title">締切が近いキャンペーン<small>60日以内</small></h2><ul class="deadlines">' +
        dls.slice(0, 8).map(function(d){
          var k = itemKey(d.it, d.cat, secDate(d.cat));
          var days = d.n === 0 ? '<span>今日</span><b>まで</b>' : '<span>あと</span><b>' + d.n + '</b><span>日</span>';
          return '<li><button class="dl c-' + d.cat + '" data-jump="' + esc(k) + '" data-cat="' + d.cat + '"><span class="dl-days">' + days + '</span>' +
            '<span class="dl-body"><span class="dl-title">' + esc(d.it.title) + '</span><span class="dl-sub">' + esc(CAT_BY[d.cat].tab) + ' · ' + esc(fmtDay(d.it.deadline)) + 'まで</span></span></button></li>';
        }).join("") + '</ul></section>';
    }

    var tops = [];
    CATS.forEach(function(c){ var its = sectionItems(c.key); if (its.length) tops.push(cardHTML(its[0], c.key, secDate(c.key), {showCat:true})); });
    if (tops.length) html += '<section class="block"><h2 class="block-title">各ジャンルのトップ</h2><div class="cards">' + tops.join("") + '</div></section>';
    return html;
  }

  function renderCat(cat){
    var c = CAT_BY[cat], sec = S.sections[cat], items = sectionItems(cat);
    var html = '<section class="cat-head c-' + cat + '"><h1>' + esc(c.title) + '</h1>';
    var prob = isLatest() ? catProblem(cat) : null;
    if (!sec) return html + '<p class="meta">' + esc(fmtDay(S.date, true)) + '</p></section>' +
      (prob ? '<p class="notice warn">' + esc(prob.msg) + '</p>' : "") +
      '<div class="empty"><h2>この日の分はまだ届いていません</h2><p>毎朝6時ごろに更新されます。右上から別の日を選べます。</p></div>';
    html += '<p class="meta">' + [fmtDay(sec.date, true), items.length + "本", sec.updated_at ? fmtTime(sec.updated_at) + " 更新" : ""].filter(Boolean).join(" · ") + '</p>';
    if (sec.date !== S.date) html += '<p class="notice warn">' + esc(fmtDay(S.date)) + 'の分は' + esc(prob ? prob.msg : "まだ届いていません") + '。いまは' + esc(fmtDay(sec.date)) + 'の分を出しています。</p>';
    if (sec.brief) html += '<div class="brief"><span class="brief-label">今日の動き</span><p>' + esc(sec.brief) + '</p></div>';
    var inds = arr(sec.indicators).filter(function(x){ return x && x.label && x.value; });
    if (inds.length) {
      html += '<div class="indicators">' + inds.map(function(x){
        var dir = x.dir === "up" || x.dir === "down" ? x.dir : "flat";
        var arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "→";
        var u = safeUrl(x.url);
        var src = [x.period, x.source].filter(Boolean).map(esc).join(" · ");
        return '<div class="ind"><span class="ind-label">' + esc(x.label) + '</span><span class="ind-value">' + esc(x.value) + '</span>' +
          (x.change ? '<span class="ind-change ' + dir + '">' + arrow + ' ' + esc(x.change) + (x.note ? ' <span style="font-weight:400;color:var(--ink-3)">' + esc(x.note) + '</span>' : "") + '</span>' : "") +
          (src ? '<span class="ind-src">' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + src + '</a>' : src) + '</span>' : "") + '</div>';
      }).join("") + '</div>';
    }
    var hot = arr(sec.hot).filter(Boolean);
    if (hot.length) html += '<div><span class="brief-label">いま熱いキーワード</span><div class="hot">' + hot.slice(0, 10).map(function(t){ return '<span>' + esc(t) + '</span>'; }).join("") + '</div></div>';
    html += '</section>';
    html += items.length ? '<div class="cards">' + items.map(function(it){ return cardHTML(it, cat, sec.date); }).join("") + '</div>' :
      '<div class="empty"><h2>今日はこのジャンルのニュースがありません</h2><p>大きな動きがない日は、まとめだけを載せています。</p></div>';
    return html;
  }

  function renderSaved(){
    var list = Object.keys(S.saved).map(function(k){ return S.saved[k]; }).filter(function(v){ return v && v.item; });
    list.sort(function(a, b){ return String(b.saved_at || "").localeCompare(String(a.saved_at || "")); });
    var html = '<section class="cat-head c-saved"><h1>保存した記事</h1><p class="meta">' + list.length + '本</p></section>';
    if (!S.uid) return html + '<div class="empty"><h2>保存はこの画面では使えません</h2><p>claude.ai にサインインして開くと、記事を保存できます。</p></div>';
    if (!list.length) return html + '<div class="empty"><h2>まだ保存した記事はありません</h2><p>記事の右下の「保存」を押すと、ここに残ります。' +
      (S.mode === "static" ? "保存はこの端末のブラウザに残ります。" : "スマホとパソコンで同じ一覧が見られます。") + '</p></div>';
    return html + '<div class="cards">' + list.map(function(v){ return cardHTML(v.item, v.cat, v.date, {showCat:true}); }).join("") + '</div>';
  }

  function render(){
    renderTabs();
    renderEdition();
    var main = document.getElementById("main");
    var body;
    if (S.view === "saved" && S.status !== "nodb" && S.status !== "loading") body = renderSaved();
    else {
      var st = stateBlock();
      if (st) body = st;
      else if (S.view === "top") body = renderTop();
      else body = renderCat(S.view);
    }
    main.innerHTML = body;
  }

  // ---------- 操作 ----------
  function setView(v){
    if (VIEWS.indexOf(v) < 0) return;
    S.view = v;
    try { history.replaceState(null, "", "#" + v); } catch(e){}
    render();
    window.scrollTo(0, 0);
  }
  function findItem(k, cat){
    var its = sectionItems(cat);
    for (var i = 0; i < its.length; i++) if (itemKey(its[i], cat, secDate(cat)) === k) return its[i];
    var sv = S.saved["sv-" + k];
    return sv ? sv.item : null;
  }
  function toggle(k){
    if (S.open[k]) delete S.open[k];
    else { S.open[k] = 1; markRead(k); }
    render();
  }
  async function toggleSave(btn){
    var k = btn.getAttribute("data-save"), cat = btn.getAttribute("data-cat"), date = btn.getAttribute("data-date");
    var id = "sv-" + k;
    var item = findItem(k, cat);
    if (S.mode === "static") {
      // 公開サイトでは、保存はこの端末のブラウザに残す
      if (S.saved[id]) delete S.saved[id];
      else if (item) S.saved[id] = {item: JSON.parse(JSON.stringify(item)), cat: cat, date: date, saved_at: new Date().toISOString()};
      try { localStorage.setItem("nken-chokan-saved", JSON.stringify(S.saved)); } catch(e){}
      render();
      return;
    }
    if (!S.db || !S.uid) return;
    if (S.saving[id]) return;
    var ref = S.db.collection("data/users/" + S.uid).doc(id);
    S.saving[id] = 1; render();
    try {
      if (S.saved[id]) await ref.delete();
      else if (item) await ref.set({item: JSON.parse(JSON.stringify(item)), cat: cat, date: date, saved_at: new Date().toISOString()});
    } catch(e) {
      S.err = e && e.code;
    }
    delete S.saving[id]; render();
  }

  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-view],[data-toggle],[data-save],[data-jump]");
    if (!t) return;
    if (t.hasAttribute("data-save")) { e.preventDefault(); toggleSave(t); return; }
    if (t.hasAttribute("data-toggle")) { toggle(t.getAttribute("data-toggle")); return; }
    if (t.hasAttribute("data-jump")) {
      var k = t.getAttribute("data-jump"), cat = t.getAttribute("data-cat");
      S.open[k] = 1; markRead(k); setView(cat);
      var el = document.getElementById("a-" + k);
      if (el) el.scrollIntoView({block:"start"});
      return;
    }
    if (t.hasAttribute("data-view")) setView(t.getAttribute("data-view"));
  });
  document.addEventListener("keydown", function(e){
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-toggle]")) {
      e.preventDefault(); var k = e.target.getAttribute("data-toggle"); toggle(k);
      var again = document.querySelector('[data-toggle="' + CSS.escape(k) + '"]'); if (again) again.focus();
    }
  });
  document.getElementById("edition").addEventListener("change", function(e){
    var d = e.target.value;
    var latest = S.index && S.index.latest;
    setDate(d, d === latest);
  });

  // ---------- データ ----------
  function setDate(d, follow){
    S.followLatest = !!follow;
    if (!d || d === S.date) { render(); return; }
    S.date = d; S.sections = {}; S.sectionsReady = false;
    if (S.mode === "static") { loadStaticDate(d); render(); return; }
    if (S.unsubSections) S.unsubSections();
    // その日までの新しい順に読み、ジャンルごとに一番新しい分を使う（その日の分が欠けたら前の日の分を出す）
    S.unsubSections = S.db.collection("sections").where("date", "<=", d).orderBy("date", "desc").limit(25).onSnapshot(function(snap){
      var next = {};
      snap.docs.forEach(function(doc){ var v = doc.exists ? doc.data() : null; if (v && v.cat && CAT_BY[v.cat] && !next[v.cat]) next[v.cat] = v; });
      S.sections = next; S.sectionsReady = true; render();
    }, function(err){ S.status = "error"; S.err = err && err.code; render(); });
    render();
  }

  // 公開サイト（claude.ai の外）では、サイトに置いたデータファイルを読む
  function getJSON(path){
    return fetch(path + (path.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), {cache: "no-store"}).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  function loadStaticDate(d){
    getJSON("data/" + d + ".json").then(function(b){
      if (S.date !== d) return;
      var next = {};
      Object.keys((b && b.sections) || {}).forEach(function(c){ var v = b.sections[c]; if (v && CAT_BY[c]) next[c] = v; });
      S.sections = next; S.sectionsReady = true; render();
    }).catch(function(){ if (S.date !== d) return; S.sections = {}; S.sectionsReady = true; render(); });
  }
  function loadStaticIndex(){
    return getJSON("data/index.json").then(function(idx){
      S.index = idx; S.status = "ready"; S.slow = false;
      var latest = idx.latest || arr(idx.dates).slice().sort().reverse()[0];
      if (!latest) { S.status = "empty"; render(); return; }
      if (!S.date || S.followLatest) {
        if (S.date === latest) loadStaticDate(latest); else setDate(latest, true);
      }
      render();
    });
  }
  function bootStatic(){
    S.mode = "static"; S.uid = "local";
    try { S.saved = JSON.parse(localStorage.getItem("nken-chokan-saved") || "{}") || {}; } catch(e){ S.saved = {}; }
    var timer = setTimeout(function(){ if (S.status === "loading") { S.slow = true; render(); } }, 10000);
    loadStaticIndex().then(function(){ clearTimeout(timer); }).catch(function(){
      clearTimeout(timer); S.status = "error"; S.err = "データを読めません"; render();
    });
    // アプリに戻ってきたとき、新しい号が出ていれば読み直す
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible" && S.status !== "loading") loadStaticIndex().catch(function(){});
    });
  }

  async function boot(){
    render();
    if (!(window.claude && window.claude.use)) { bootStatic(); return; }
    var db = null;
    try { db = await window.claude.use("db"); } catch(e){ db = null; }
    if (!db) { S.status = "nodb"; render(); return; }
    S.db = db;
    try {
      var user = await window.claude.use("user");
      S.uid = user ? await user.id() : null;
    } catch(e){ S.uid = null; }

    var timer = setTimeout(function(){ if (S.status === "loading" || !S.sectionsReady) { S.slow = true; render(); } }, 10000);
    db.doc("meta/index").onSnapshot(function(snap){
      if (!snap.metadata.fromCache) { clearTimeout(timer); S.slow = false; }
      if (!snap.exists) {
        if (!snap.metadata.fromCache) { S.status = "empty"; render(); }
        return;
      }
      var d = snap.data() || {};
      S.index = d;
      S.status = "ready";
      var dates = arr(d.dates).slice().sort().reverse();
      var latest = d.latest || dates[0];
      if (!S.date || S.followLatest) setDate(latest, true); else render();
    }, function(err){ clearTimeout(timer); S.status = "error"; S.err = err && err.code; render(); });

    if (S.uid) {
      db.collection("data/users/" + S.uid).onSnapshot(function(snap){
        var next = {};
        snap.docs.forEach(function(doc){ if (doc.exists && /^sv-/.test(doc.id)) next[doc.id] = doc.data(); });
        S.saved = next; render();
      }, function(){ /* 保存が使えないときは一覧を空のままにする */ });
    }
  }

  boot();
})();
</script>

</body></html>
